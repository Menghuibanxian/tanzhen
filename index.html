    <!-- Top Status Bar (Hidden initially) -->

        <div class="status-center">

            </div>
            <div class="status-item">

            <div class="status-item">

            <div class="status-item">

            <!-- Cards injected by script -->
        </div>

        <!-- Site Monitor Section -->
        <div id="site-monitor" class="site-monitor" style="margin-top: 50px; display: none;">
            <h2 class="section-title">肉便器状态</h2>
            <!-- Replaced table with grid for card view -->

    <!-- Footer Buttons (Fixed Bottom) -->
    <div class="footer-dock">
        <a href="https://sww.nocc.cc/" target="_blank" class="dock-btn">Sublink</a>

    </div>

    <!-- Scripts -->
    <script src="script.js?v=1.2"></script>
    <script>
        // 强制至少3秒，最多5秒 + 进度条
        (function () {
            const loader = document.getElementById('exia-loader');
            const progressBar = document.getElementById('exia-progress');
            const MIN_TIME = 2000;   // 至少显示3秒
            const MAX_TIME = 5000;   // 最多显示5秒
            const startTime = Date.now();

            // 立即显示顶部状态栏
            const statusBar = document.getElementById('status-bar');
            if (statusBar) {
                statusBar.classList.remove('hidden');
                // Use setTimeout to ensure transition plays
                setTimeout(() => {
                    statusBar.classList.add('visible');
                    statusBar.style.opacity = '1';
                    statusBar.style.transform = 'translateY(0)';
                }, 100);
            }

            // 进度条：5秒内从0走到100%
            const updateProgress = () => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / MAX_TIME) * 100, 100);
                if (progressBar) progressBar.style.width = progress + '%';

                if (elapsed < MAX_TIME && loader.parentElement) {
                    requestAnimationFrame(updateProgress);
                } else {
                    if (progressBar) progressBar.style.width = '100%';
                }
            };
            requestAnimationFrame(updateProgress); // Start immediately

            // 统一的隐藏函数
            const hideLoader = () => {
                if (progressBar) progressBar.style.width = '100%';
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        if (loader.parentElement) loader.remove();
                        // Trigger visible state for elements
                        const statusBar = document.getElementById('status-bar');
                        if (statusBar) {
                            statusBar.classList.remove('hidden');
                            statusBar.classList.add('visible');
                            // Failsafe: force styles directly in case class fails
                            statusBar.style.opacity = '1';
                            statusBar.style.transform = 'translateY(0)';
                        }
                    }, 600);
                }
            };

            // 记录页面是否真正加载完成
            window.addEventListener('load', () => {
                const elapsed = Date.now() - startTime;
                if (elapsed >= MIN_TIME) {
                    hideLoader();
                } else {
                    setTimeout(hideLoader, MIN_TIME - elapsed);
                }
            });

            // 保险：5秒后强制关闭
            setTimeout(() => {
                if (loader && loader.parentElement) {
                    hideLoader();
                }
            }, MAX_TIME);
        })();
    </script>
</body>
